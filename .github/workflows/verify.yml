name: Verify Bliss Media

on:
  push:
    branches:
      - phase-2/backend
      - design/premium-editorial-refresh
  pull_request:
    branches:
      - phase-2/backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check security foundation
        run: npm run test:security
      - name: Build production app
        run: npm run build
